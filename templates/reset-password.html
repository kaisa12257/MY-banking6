<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 재설정 - My-Banking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- Supabase JS 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; height:100vh; background:var(--dark);">
    <div class="card" style="width:350px; text-align:center;">
        <h2>🔐 새 비밀번호 설정</h2>
        <p style="font-size:0.8rem; color:gray; margin-bottom:20px;">새롭게 사용할 비밀번호를 입력해주세요.</p>
        <input type="password" id="new-pw" placeholder="새 비밀번호 (6자 이상)" style="width:100%; margin-bottom:10px;">
        <input type="password" id="new-pw-confirm" placeholder="비밀번호 확인" style="width:100%; margin-bottom:15px;">
        <button onclick="updatePassword()" class="btn-save" style="width:100%;">비밀번호 변경 완료</button>
    </div>

    <script>
        // Supabase 초기화 (기존 정보 사용)
        const supabase = supabase.createClient("https://ibrfukaljdcwsarukknf.supabase.co", "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlicmZ1a2FsamRjd3NhcnVra25mIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc3ODA4MjU4MSwiZXhwIjoyMDkzNjU4NTgxfQ._jKLrKgnsxU3hjM1mPWKgoQg0waxrfX6erybMhKuUNc");

        async function updatePassword() {
            const pw = document.getElementById('new-pw').value;
            const pwConfirm = document.getElementById('new-pw-confirm').value;

            if (pw !== pwConfirm) {
                alert("비밀번호가 일치하지 않습니다.");
                return;
            }

            const { data, error } = await supabase.auth.updateUser({
                password: pw
            });

            if (data) {
                alert("비밀번호가 성공적으로 변경되었습니다! 다시 로그인해 주세요.");
                window.location.href = "/";
            } else {
                alert("에러 발생: " + error.message);
            }
        }
    </script>
</body>
</html>
