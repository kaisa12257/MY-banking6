<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - My-Banking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; background:var(--dark); padding: 20px; box-sizing:border-box;">
    <div class="card" style="width:100%; max-width:400px; text-align:center; padding: 30px 25px;">
        <h2 style="font-size:1.5rem; margin-bottom:10px;">🔐 새 비밀번호 설정</h2>
        <p style="font-size:0.85rem; color:gray; margin-bottom:25px;">새롭게 사용할 비밀번호를 입력해주세요.</p>
        <input type="password" id="new-pw" placeholder="새 비밀번호"
            autocomplete="new-password"
            style="width:100%; margin-bottom:12px; font-size:1rem; padding:14px; box-sizing:border-box;">
        <input type="password" id="new-pw-confirm" placeholder="비밀번호 확인"
            autocomplete="new-password"
            style="width:100%; margin-bottom:20px; font-size:1rem; padding:14px; box-sizing:border-box;">
        <button onclick="updatePassword()" class="btn-save"
            style="width:100%; padding:16px; font-size:1rem;">비밀번호 변경 완료</button>
    </div>

    <script>
        const { createClient } = supabase;
        const supabaseClient = createClient(
            "https://ibrfukaljdcwsarukknf.supabase.co",
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlicmZ1a2FsamRjd3NhcnVra25mIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwODI1ODEsImV4cCI6MjA5MzY1ODU4MX0.BuOqSVScS8TCcQhNnUNHSicTip7mFq9u8Oy-c1xyteQ"
        );

        window.onload = async function() {
            const { data, error } = await supabaseClient.auth.getSession();
            if (error || !data.session) {
                alert("유효하지 않거나 만료된 링크입니다. 다시 요청해주세요.");
                window.location.href = "/";
            }
        }

        async function updatePassword() {
            const pw = document.getElementById('new-pw').value;
            const pwConfirm = document.getElementById('new-pw-confirm').value;

            if (pw !== pwConfirm) return alert("비밀번호가 일치하지 않습니다.");

            const { data, error } = await supabaseClient.auth.updateUser({ password: pw });

            if (error) {
                alert("에러 발생: " + error.message);
            } else {
                alert("비밀번호가 성공적으로 변경되었습니다! 다시 로그인해 주세요.");
                window.location.href = "/";
            }
        }
    </script>
</body>
</html>
