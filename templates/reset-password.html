<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 재설정 - My-Banking</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .reset-box { max-width: 400px; margin: 60px auto; padding: 0 20px; }
        .reset-box h2 { font-size: 1.3rem; margin-bottom: 20px; text-align: center; }
        .msg { font-size: 0.85rem; text-align: center; margin-top: 10px; padding: 10px; border-radius: 8px; }
        .msg.success { background: #f0fdf4; color: #16a34a; }
        .msg.error { background: #fef2f2; color: #dc2626; }
    </style>
</head>
<body>
<header style="justify-content: center;">
    <span style="color:white; font-weight:bold;">🔒 비밀번호 재설정</span>
</header>

<div class="reset-box">
    <div class="card">
        <h2>새 비밀번호 설정</h2>
        <input type="password" id="newPw" placeholder="새 비밀번호 (6자 이상)" style="margin-bottom:10px;">
        <input type="password" id="newPwRe" placeholder="새 비밀번호 확인" style="margin-bottom:15px;">
        <button onclick="doReset()" class="btn-save">변경하기</button>
        <div id="resetMsg"></div>
    </div>
</div>

<script>
    const hash = window.location.hash.substring(1);
const params = new URLSearchParams(hash);
const urlParams = new URLSearchParams(window.location.search);
const accessToken = params.get('access_token') || urlParams.get('access_token');
const refreshToken = params.get('refresh_token') || urlParams.get('refresh_token');

    if (!accessToken) {
        document.getElementById('resetMsg').innerHTML =
            '<div class="msg error">❌ 유효하지 않은 링크입니다. 다시 요청해주세요.</div>';
        document.querySelector('button').disabled = true;
    }

    async function doReset() {
        const pw = document.getElementById('newPw').value;
        const pwRe = document.getElementById('newPwRe').value;
        const msgEl = document.getElementById('resetMsg');

        if (!pw || pw.length < 6) {
            msgEl.innerHTML = '<div class="msg error">비밀번호는 6자 이상 입력하세요.</div>';
            return;
        }
        if (pw !== pwRe) {
            msgEl.innerHTML = '<div class="msg error">비밀번호가 일치하지 않습니다.</div>';
            return;
        }

        const res = await fetch('/api/reset-password-confirm', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                access_token: accessToken,
                refresh_token: refreshToken,
                password: pw
            })
        });
        const data = await res.json();

        if (data.status === 'success') {
            msgEl.innerHTML = '<div class="msg success">✅ 비밀번호가 변경되었습니다! 잠시 후 로그인 페이지로 이동합니다.</div>';
            setTimeout(() => { location.href = '/'; }, 2500);
        } else {
            msgEl.innerHTML = `<div class="msg error">❌ ${data.message}</div>`;
        }
    }
</script>
</body>
</html>
